# Terms the translator must not "translate away". Sadhguru's discourse leans on
# Sanskrit/yogic vocabulary that already exists in Telugu — rendering it into
# everyday words loses the meaning, and inventing new words loses the audience.
terms:
  yoga: యోగా
  yogi: యోగి
  karma: కర్మ
  dharma: ధర్మం
  guru: గురువు
  mystic: ఆధ్యాత్మికవేత్త
  meditation: ధ్యానం
  consciousness: చైతన్యం
  awareness: అవగాహన
  wellbeing: క్షేమం
  spirituality: ఆధ్యాత్మికత
  liberation: ముక్తి
  devotion: భక్తి
  Isha: ఈశా
  Adiyogi: ఆదియోగి
  Shambhavi: శాంభవి
  Dhyanalinga: ధ్యానలింగం
  Sadhguru: సద్గురు
