version: '3.9'

# FIX #16: Explicit network prevents cross-project container name collisions
networks:
  jarvis-net:
    driver: bridge

services:
  # ─── Vector Database ───────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: jarvis-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - jarvis-net
    restart: unless-stopped

  # ─── Redis (session + cache) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - jarvis-net
    restart: unless-stopped

  # ─── Ollama (local embeddings) ──────────────────────────────────
  # FIX #1: Ollama service was completely missing. The entire embedding stack
  # uses nomic-embed-text via Ollama. Without this the backend and watcher
  # containers fail to embed anything on startup.
  ollama:
    image: ollama/ollama:latest
    container_name: jarvis-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - jarvis-net
    restart: unless-stopped
    # Pull embedding model automatically on first start
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 8 && ollama pull nomic-embed-text && wait"]

  # ─── Backend (FastAPI + LangGraph) ─────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jarvis-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ${USERPROFILE:-$HOME}:/user_home:ro
      - ./backend:/app
    environment:
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - USER_HOME=/user_home
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://ollama:11434   # FIX #1
    networks:
      - jarvis-net
    depends_on:
      - qdrant
      - redis
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Frontend (React + Nginx) ───────────────────────────────────
  # FIX #2: VITE_API_URL must be a BUILD-TIME ARG, not a runtime env var.
  # Vite bakes VITE_* vars into the JS bundle during `npm run build`.
  # Setting it under `environment:` only affects runtime — the already-built
  # bundle already has the hardcoded fallback `http://localhost:8000`.
  # Fix: pass as Docker build-arg so the Dockerfile injects it before the build.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: jarvis-frontend
    ports:
      - "3000:3000"
    networks:
      - jarvis-net
    depends_on:
      - backend
    restart: unless-stopped

  # ─── File Watcher (auto-ingestion daemon) ──────────────────────
  watcher:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jarvis-watcher
    command: python -m ingestion.watcher
    env_file:
      - .env
    volumes:
      - ${USERPROFILE:-$HOME}:/user_home:ro
      - ./backend:/app
    environment:
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - USER_HOME=/user_home
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://ollama:11434   # FIX #1
    networks:
      - jarvis-net
    depends_on:
      - qdrant
      - redis
      - ollama
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
  ollama_data:   # FIX #1: persist downloaded Ollama models across restarts
