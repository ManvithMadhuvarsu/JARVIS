version: '3.9'

services:
  # ─── Vector Database ───────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: jarvis-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ─── Redis (session + cache) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ─── Backend (FastAPI + LangGraph) ─────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jarvis-backend
    ports:
      - "8000:8000"
    env_file:
      - .env                       # Load from .env file automatically
    volumes:
      - ${USERPROFILE:-$HOME}:/user_home:ro    # Works on Windows (USERPROFILE) and Linux/Mac (HOME)
      - ./backend:/app             # Hot-reload during dev
    environment:
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - USER_HOME=/user_home
      - PYTHONPATH=/app            # Ensures all module imports resolve
      - PYTHONUNBUFFERED=1
    depends_on:
      - qdrant
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Frontend (React + Nginx) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jarvis-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  # ─── File Watcher (auto-ingestion daemon) ──────────────────────
  watcher:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jarvis-watcher
    command: python -m ingestion.watcher
    env_file:
      - .env                       # Load from .env file automatically
    volumes:
      - ${USERPROFILE:-$HOME}:/user_home:ro    # Works on Windows (USERPROFILE) and Linux/Mac (HOME)
      - ./backend:/app
    environment:
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - USER_HOME=/user_home
      - PYTHONPATH=/app            # Required for module resolution
      - PYTHONUNBUFFERED=1
    depends_on:
      - qdrant
      - redis
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
